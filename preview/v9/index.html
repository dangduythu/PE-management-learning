<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PE Management V9 | Preview</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172b4d;background:#f3f6fb;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.shell{display:flex;min-height:100vh}.side{width:232px;background:#142b47;color:#dce8f8;flex-shrink:0;padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:11px;align-items:center;padding:6px 10px 24px;border-bottom:1px solid #38506c;font-weight:800;letter-spacing:.6px}.logo{padding:10px;border-radius:10px;background:#3579e5;color:white}.brand small{display:block;color:#9ab3d2;font-weight:500;letter-spacing:0;margin-top:3px}nav{padding-top:18px}nav button{display:block;width:100%;border:0;text-align:left;background:transparent;color:#cbd8e9;padding:12px;border-radius:9px;margin-bottom:4px}nav button:hover,nav button.active{background:#28517d;color:white}.main{flex:1;min-width:0}.top{padding:17px 30px;background:white;border-bottom:1px solid #e1e8f2;display:flex;align-items:center;justify-content:space-between;gap:12px}.top strong{font-size:16px}.content{max-width:1400px;margin:auto;padding:26px 30px}.muted{color:#687b95}.tiny{font-size:12px}.eyebrow{font-size:11px;letter-spacing:1px;color:#52739b;font-weight:700;text-transform:uppercase}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}h1{font-size:27px;margin:4px 0}h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid #e3eaf3;border-radius:14px;padding:19px;box-shadow:0 3px 12px #1a416009}.metric .number{font-size:28px;font-weight:750;margin:12px 0 6px}.metric small{color:#6d7e91}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}.btn{border:0;border-radius:9px;background:#2567d7;color:white;padding:10px 14px;font-weight:650}.btn.alt{background:#eef4fd;color:#285388}.btn.danger{background:#fdf0f0;color:#ad3333}.btn.small{padding:7px 10px;font-size:12px}.buttons{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tag{display:inline-flex;border-radius:16px;padding:4px 9px;font-size:11px;background:#ecf3ff;color:#295a9c;font-weight:650}.tag.red{background:#fff0f0;color:#b43838}.tag.green{background:#e6f8f0;color:#117849}.tag.orange{background:#fff5dc;color:#9a6400}.bar{height:9px;background:#e9eef6;border-radius:20px;overflow:hidden;margin:9px 0}.fill{height:100%;background:#3175e2}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:12px;border-bottom:1px solid #edf1f7;white-space:nowrap}th{font-size:11px;color:#657c97;text-transform:uppercase;letter-spacing:.5px;background:#f9fbff}tr:last-child td{border:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}input,select,textarea{padding:10px 11px;border:1px solid #d5e0ec;border-radius:9px;background:white;color:#172b4d;max-width:100%}textarea{width:100%;min-height:75px}label{display:block;color:#586e88;font-size:12px;font-weight:650;margin:11px 0 5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.formgrid input,.formgrid select{width:100%}.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:12px;overflow:auto}.column{background:#edf2f9;border-radius:12px;padding:12px;min-height:220px}.column h3{font-size:13px;margin:4px 0 12px}.ticket{background:white;padding:14px;border:1px solid #e0e8f2;border-radius:11px;margin-bottom:10px}.ticket b{display:block;margin:10px 0;font-size:13px}.ticket p{margin:4px 0;font-size:12px;color:#678}.hidden{display:none!important}.note{padding:12px 14px;border-radius:10px;background:#eaf3ff;border:1px solid #d1e5ff;color:#245187;margin-bottom:18px}.warn{background:#fff5e7;border-color:#f6dfb8;color:#805611}.empty{padding:28px;text-align:center;color:#8190a4}.modal{position:fixed;inset:0;background:#142b4777;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.dialog{background:white;border-radius:16px;padding:24px;width:min(620px,100%);max-height:90vh;overflow:auto}.dialog h2{margin-bottom:6px}.split{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{background:#eaf3ff;color:#24518e;border-radius:20px;padding:5px 10px;font-size:11px}.stack>*+*{margin-top:12px}.audit{border-left:3px solid #d7e2f0;padding:8px 13px;margin:9px 0}.mini{font-size:12px}#toast{position:fixed;bottom:18px;right:18px;background:#193b60;color:white;border-radius:10px;padding:12px 16px;display:none;z-index:20}.mobilehead{display:none}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.side{width:190px}.content{padding:20px}}@media(max-width:650px){.shell{display:block}.side{position:static;width:100%;height:auto;padding:10px}.brand{padding:4px 8px 8px}nav{display:flex;overflow:auto;padding-top:8px}nav button{width:auto;white-space:nowrap}.top{padding:12px}.content{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:13px}.metric .number{font-size:23px}.formgrid{grid-template-columns:1fr}.board{grid-template-columns:repeat(4,220px)}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><span class="logo">PE</span><span>MANAGEMENT<small>V9 · ENGINEERING HUB</small></span></div><nav id="nav"></nav></aside><div class="main"><header class="top"><strong>Process Engineering <span class="muted">/ V9 Preview</span></strong><div class="buttons"><span class="pill">● DEMO MODE</span><span class="tiny muted" id="date"></span></div></header><main class="content"><div id="page"></div></main></div></div><div id="modal" class="modal hidden"></div><div id="toast"></div>
<script>
"use strict";
const KEY="pe-management-v9",OLD=["pe-management-unified-v7","pe-management-unified-v8alpha","pe-management-unified-v4","pe-management-line-control-v3"];
const collections=["templates","checks","issues","tasks","reviews","improvements","production","employees","capaActions","projects","auditEvents"];
const $=x=>document.getElementById(x),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const copy=x=>JSON.parse(JSON.stringify(x)), uid=()=>globalThis.crypto?.randomUUID?.()||Date.now()+"-"+Math.random().toString(36).slice(2), now=()=>new Date().toISOString(), today=()=>new Date().toISOString().slice(0,10);
function blank(){return {schemaVersion:9,metadata:{createdAt:now(),source:"new"},...Object.fromEntries(collections.map(k=>[k,[]]))}}
function migrate(source,label){if(!source||typeof source!=="object")throw Error("Dữ liệu không phải đối tượng JSON");const d=copy(source);for(const k of ["templates","checks","issues"])if(!Array.isArray(d[k]))throw Error("Thiếu hoặc sai dữ liệu "+k);for(const k of collections){if(d[k]===undefined)d[k]=[];if(!Array.isArray(d[k]))throw Error("Collection không hợp lệ: "+k)}d.schemaVersion=9;d.metadata={...(d.metadata||{}),source:label,migratedAt:now()};for(const k of collections){const ids=new Set();for(const item of d[k]){if(!item||typeof item!=="object")throw Error("Bản ghi sai ở "+k);if(item.id!=null){let id=String(item.id);if(ids.has(id))throw Error("ID trùng trong "+k+": "+id);ids.add(id)}}}return d}
let db;try{const raw=localStorage.getItem(KEY);db=raw?migrate(JSON.parse(raw),"v9"):blank()}catch(e){db=blank();setTimeout(()=>alert("Dữ liệu V9 không đọc được: "+e.message+". Không ghi đè dữ liệu cũ. Hãy dùng công cụ Backup/Restore."),100)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast("Không thể lưu: "+e.message);return false}}
function toast(s){const el=$("toast");el.textContent=s;el.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display="none",3500)}
function stamp(entity,entityId,action){db.auditEvents.push({id:uid(),entity,entityId,action,actor:"Local demo user",timestamp:now()})}
const menus=[["overview","◫","Tổng quan"],["lines","▤","Line & Yield"],["checks","☑","Line Check"],["tasks","▦","Task Kanban"],["issues","⚠","Issue & CAPA"],["team","♙","PE Team"],["approvals","✓","Approval Center"],["kpis","◩","KPI & Reports"],["projects","↗","Improvements"],["data","↻","Backup & Restore"]];
let view="overview",taskQuery="",issueQuery="";
function nav(id){view=id;$("nav").innerHTML=menus.map(([key,ico,label])=>'<button class="'+(key===id?"active":"")+'" data-nav="'+key+'">'+ico+' &nbsp; '+label+'</button>').join("");document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>nav(b.dataset.nav));render()}
const tag=(text,kind="")=>'<span class="tag '+kind+'">'+esc(text)+'</span>';
function title(t,sub,buttons=""){return '<div class="heading"><div><div class="eyebrow">PE · Operations</div><h1>'+t+'</h1><div class="muted">'+sub+'</div></div><div class="buttons">'+buttons+'</div></div>'}
function metric(k,v,sub){return '<div class="card metric"><small>'+esc(k)+'</small><div class="number">'+esc(v)+'</div><small>'+esc(sub)+'</small></div>'}
function progress(n){return '<div class="bar"><div class="fill" style="width:'+Math.min(100,Math.max(0,Number(n)||0))+'%"></div></div>'}
function empty(s){return '<div class="empty">'+esc(s)+'</div>'}
function yieldData(){let input=0,good=0;for(const p of db.production){input+=Number(p.total)||0;good+=Number(p.good)||0}return {input,good,yield:input?100*good/input:null}}
function overview(){const y=yieldData(),open=db.issues.filter(x=>!x.archived&&x.status!=="Closed"),pending=db.tasks.filter(x=>["Pending review","Pending manager"].includes(x.status)),over=db.tasks.filter(x=>x.due&&x.due<today()&&!["Reviewed","Completed"].includes(x.status));return title("PE Command Center","Tổng quan hoạt động và các công việc ưu tiên")+'<div class="note warn">Đây là bản demo độc lập trong trình duyệt, không có đăng nhập thật hoặc đồng bộ máy chủ. Chỉ dùng dữ liệu giả lập hoặc được phép.</div><div class="grid">'+metric("Weighted Yield",y.yield===null?"—":y.yield.toFixed(2)+"%","Input: "+y.input.toLocaleString())+metric("Open Issues",open.length,"Chưa đóng")+metric("Pending Approval",pending.length,"Leader / Manager")+metric("Overdue Tasks",over.length,"Cần ưu tiên")+'</div><div class="two"><div class="card"><h2>Production overview</h2>'+ (db.production.length?'<div class="tablewrap"><table><tr><th>Ngày</th><th>Line</th><th>Lot</th><th>Input</th><th>Good</th><th>Yield</th></tr>'+db.production.slice(-8).reverse().map(p=>'<tr><td>'+esc(p.date)+'</td><td>'+esc(p.line)+'</td><td>'+esc(p.lot)+'</td><td>'+esc(p.total)+'</td><td>'+esc(p.good)+'</td><td>'+((Number(p.total)>0)?(100*Number(p.good)/Number(p.total)).toFixed(2)+"%":"—")+'</td></tr>').join("")+'</table></div>':empty("Chưa có Production Data. Import dữ liệu V7 hoặc thử với dữ liệu mẫu."))+'</div><div class="card"><h2>Priority inbox</h2>'+([...over.map(x=>["TASK",x.name,x.due]),...open.filter(x=>x.severity==="Critical"||x.severity==="Major").map(x=>["ISSUE",x.title,x.due])].slice(0,7).map(x=>'<div class="audit"><b>'+tag(x[0])+' '+esc(x[1])+'</b><p class="tiny muted">Due: '+esc(x[2]||"—")+'</p></div>').join("")||empty("Không có cảnh báo ưu tiên"))+'</div></div>'}
function tasks(){const cols=[["Not started","Backlog"],["In progress","In Progress"],["Pending review","Leader Review"],["Pending manager","Manager Review"]];const arr=db.tasks.filter(t=>(t.name+" "+t.owner).toLowerCase().includes(taskQuery.toLowerCase()));return title("Task Management","Kanban, phân công, tiến độ và bằng chứng",'<button class="btn" id="newTask">+ Thêm Task</button>')+'<div class="filters"><input id="taskSearch" placeholder="Tìm task / owner..." value="'+esc(taskQuery)+'"><button class="btn alt" id="taskTable">Danh sách</button></div><div class="board">'+cols.map(([status,caption])=>'<div class="column"><h3>'+caption+' '+tag(arr.filter(t=>t.status===status).length)+'</h3>'+arr.filter(t=>t.status===status).map(t=>'<div class="ticket">'+tag(t.priority||"Medium",t.priority==="High"?"red":"")+'<b>'+esc(t.name)+'</b><p>'+esc(t.owner||"Chưa giao")+' · '+esc(t.due||"No due")+'</p>'+progress(t.progress)+'<div class="split"><span class="tiny muted">'+esc(t.progress||0)+'%</span><button class="btn alt small" data-edit-task="'+esc(t.id)+'">Chi tiết</button></div></div>').join("")+'</div>').join("")+'</div>'+(arr.filter(t=>!cols.some(c=>c[0]===t.status)).length?'<div class="card" style="margin-top:15px"><h2>Đã hoàn thành / Khác</h2>'+arr.filter(t=>!cols.some(c=>c[0]===t.status)).map(t=>'<div class="audit">'+tag(t.status||"Khác","green")+' '+esc(t.name)+' — '+esc(t.owner)+'</div>').join("")+'</div>':"")}
function issuePage(){const arr=db.issues.filter(x=>(x.title+" "+x.line+" "+x.pic).toLowerCase().includes(issueQuery.toLowerCase()));return title("Issue & CAPA","Theo dõi bất thường, nguyên nhân gốc và hành động khắc phục",'<button class="btn" id="newIssue">+ Thêm Issue</button>')+'<div class="filters"><input id="issueSearch" placeholder="Tìm issue / line / PIC" value="'+esc(issueQuery)+'"></div><div class="card tablewrap"><table><tr><th>Issue</th><th>Line</th><th>Severity</th><th>Status</th><th>PIC</th><th>Due</th><th></th></tr>'+arr.map(i=>'<tr><td><b>'+esc(i.title)+'</b></td><td>'+esc(i.line)+'</td><td>'+tag(i.severity||"Major",i.severity==="Critical"?"red":"orange")+'</td><td>'+tag(i.status||"Open")+'</td><td>'+esc(i.pic)+'</td><td>'+esc(i.due)+'</td><td><button class="btn alt small" data-edit-issue="'+esc(i.id)+'">Mở</button></td></tr>').join("")+'</table>'+(!arr.length?empty("Chưa có issue"): "")+'</div>'}
function lines(){const y=yieldData();const agg={};for(const p of db.production){const k=p.line||"Unknown";agg[k]??={total:0,good:0};agg[k].total+=Number(p.total)||0;agg[k].good+=Number(p.good)||0}return title("Line & Yield","Sản lượng, tỷ lệ đạt và bất thường theo Line")+'<div class="grid">'+metric("Total Input",y.input.toLocaleString(),"Sản phẩm")+metric("Good",y.good.toLocaleString(),"Sản phẩm")+metric("NG",(y.input-y.good).toLocaleString(),"Sản phẩm")+metric("Yield",y.yield===null?"—":y.yield.toFixed(2)+"%","Weighted")+'</div><div class="card" style="margin-top:16px"><h2>Performance by Line</h2>'+Object.entries(agg).map(([line,x])=>'<div class="audit"><div class="split"><b>'+esc(line)+'</b><b>'+ (x.total? (x.good/x.total*100).toFixed(2):"—")+'%</b></div>'+progress(x.total?x.good/x.total*100:0)+'<div class="muted tiny">Input: '+x.total+' · Good: '+x.good+'</div></div>').join("")+(Object.keys(agg).length?"":empty("Chưa có dữ liệu sản xuất"))+'</div>'}
function checks(){return title("Line Check","Kết quả kiểm tra và checklist gốc")+'<div class="grid">'+metric("Total Checks",db.checks.length,"Mọi trạng thái")+metric("NG",db.checks.filter(x=>x.result==="NG").length,"Cần xử lý")+metric("Templates",db.templates.length,"Check sheet")+metric("Issues",db.issues.length,"Được ghi nhận")+'</div><div class="card tablewrap" style="margin-top:16px"><h2>Lịch sử kiểm tra</h2><table><tr><th>Ngày</th><th>Line</th><th>Machine</th><th>Lot</th><th>Result</th><th>Inspector</th></tr>'+db.checks.slice().reverse().slice(0,100).map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.line)+'</td><td>'+esc(x.machine)+'</td><td>'+esc(x.lot)+'</td><td>'+tag(x.result||"—",x.result==="NG"?"red":"green")+'</td><td>'+esc(x.by)+'</td></tr>').join("")+'</table>'+(!db.checks.length?empty("Chưa có dữ liệu kiểm tra"): "")+'</div>'}
function team(){const people=db.employees.length?db.employees:Array.from(new Set(db.tasks.map(t=>t.owner).filter(Boolean))).map((name,i)=>({id:"virtual-"+i,name,role:"Chưa xác định"}));return title("PE Team","Nhân sự, workload và phân bổ công việc",'<button class="btn" id="newEmployee">+ Nhân sự</button>')+'<div class="grid">'+metric("Team",people.length,"Nhân sự") +metric("Active Tasks",db.tasks.filter(t=>!["Reviewed","Completed"].includes(t.status)).length,"Đang xử lý")+metric("Completed",db.tasks.filter(t=>["Reviewed","Completed"].includes(t.status)).length,"Đã duyệt")+metric("Open Issues",db.issues.filter(i=>i.status!=="Closed").length,"Chưa đóng")+'</div><div class="card tablewrap" style="margin-top:16px"><table><tr><th>Thành viên</th><th>Vai trò</th><th>Task</th><th>Chưa hoàn thành</th></tr>'+people.map(p=>{let tasks=db.tasks.filter(t=>t.owner===p.name);return '<tr><td>'+esc(p.name)+'</td><td>'+esc(p.role)+'</td><td>'+tasks.length+'</td><td>'+tasks.filter(t=>!["Reviewed","Completed"].includes(t.status)).length+'</td></tr>'}).join("")+'</table>'+(!people.length?empty("Hãy import dữ liệu hoặc thêm nhân sự"): "")+'</div>'}
function approvals(){const arr=db.tasks.filter(t=>["Pending review","Pending manager"].includes(t.status));return title("Approval Center","Quy trình demo: Leader → PE Manager")+'<div class="note warn">Không phải phân quyền bảo mật. Bạn có thể chọn vai trò demo. Các quyết định chỉ nằm trong trình duyệt này.</div><div class="filters"><select id="approverRole"><option value="leader">Demo Leader</option><option value="manager">Demo PE Manager</option></select></div><div class="card tablewrap"><table><tr><th>Task</th><th>Owner</th><th>Progress</th><th>Stage</th><th></th></tr>'+arr.map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+esc(t.owner)+'</td><td>'+esc(t.progress)+'%</td><td>'+tag(t.status)+'</td><td><button class="btn small" data-review="'+esc(t.id)+'">Review</button></td></tr>').join("")+'</table>'+(!arr.length?empty("Không có yêu cầu đang chờ"): "")+'</div><div class="card" style="margin-top:16px"><h2>Review History</h2>'+db.reviews.slice(-12).reverse().map(r=>'<div class="audit">'+esc(r.reviewer||"—")+' · '+tag(r.decision||"—")+' · '+esc(r.name||r.task||"Task")+' <small>'+esc(r.date||"")+'</small></div>').join("")+(!db.reviews.length?empty("Chưa có lịch sử"): "")+'</div>'}
function kpis(){const tasks=db.tasks,closed=tasks.filter(t=>["Reviewed","Completed"].includes(t.status)),over=tasks.filter(t=>t.due&&t.due<today()&&!closed.includes(t));return title("KPI & Reports","Báo cáo hiệu quả PE · Demo")+'<div class="grid">'+metric("Task Completed",closed.length,"Số công việc")+metric("Completion Rate",tasks.length?(closed.length/tasks.length*100).toFixed(1)+"%":"—","Tỷ lệ hoàn thành")+metric("Overdue",over.length,"Quá hạn")+metric("Approved Quality",(()=>{const r=tasks.filter(t=>t.status==="Reviewed"&&Number.isFinite(Number(t.approved)));return r.length?(r.reduce((a,t)=>a+Number(t.approved),0)/r.length).toFixed(1)+"%":"—"})(),"Trung bình demo")+'</div><div class="card" style="margin-top:16px"><h2>Export & báo cáo</h2><p class="muted">Xuất dữ liệu V9 sang JSON để sao lưu hoặc kiểm tra. Chỉ số KPI mới là minh họa, không thay thế công thức Legacy V7.</p><button class="btn" id="exportData">Xuất JSON Backup</button></div>'}
function projects(){return title("Improvement Portfolio","Dự án tăng Yield, giảm NG, giảm Cycle Time",'<button class="btn" id="newProject">+ Dự án</button>')+'<div class="grid">'+metric("Improvements",db.improvements.length,"Legacy")+metric("Projects",db.projects.length,"V9")+metric("In progress",db.projects.filter(p=>p.status==="In progress").length,"Dự án")+metric("Completed",db.projects.filter(p=>p.status==="Completed").length,"Dự án")+'</div><div class="card" style="margin-top:16px"><h2>Danh sách cải tiến</h2>'+[...db.projects,...db.improvements].map(p=>'<div class="audit"><div class="split"><b>'+esc(p.title||p.name)+'</b>'+tag(p.status||"Open")+'</div><div class="muted tiny">'+esc(p.area||p.process||"")+' · PIC: '+esc(p.pic||p.owner||"—")+' · Due: '+esc(p.due||"—")+'</div></div>').join("")+(!db.projects.length&&!db.improvements.length?empty("Chưa có dự án cải tiến"): "")+'</div>'}
function dataPage(){const sizes=collections.map(k=>'<tr><td>'+esc(k)+'</td><td>'+db[k].length+'</td></tr>').join("");return title("Backup & Restore","Sao lưu, chuyển dữ liệu V7/V8 sang V9")+'<div class="note warn">Mọi thao tác import đều tạo bản V9 mới. Không bao giờ ghi vào khóa dữ liệu V7 hoặc V8. Hãy tải bản sao lưu trước khi thay thế dữ liệu đang dùng.</div><div class="two"><div class="card"><h2>Quản lý dữ liệu</h2><p class="muted">Nguồn hiện tại: '+esc(db.metadata?.source||"Unknown")+'</p><div class="buttons"><button class="btn" id="exportData">⬇ Export V9 JSON</button><button class="btn alt" id="migrateOld">Đọc V7/V8 trên thiết bị</button></div><label>Import JSON backup đã xuất</label><input type="file" id="importFile" accept=".json,application/json"><p class="tiny muted">V9 đọc khóa dữ liệu cũ trên cùng origin; nếu đổi domain, hãy dùng file JSON.</p><button class="btn alt" id="loadSamples">Nạp dữ liệu mẫu (chỉ khi V9 đang trống)</button></div><div class="card"><h2>Data Collections</h2><table><tr><th>Collection</th><th>Records</th></tr>'+sizes+'</table></div></div>'}
function render(){const pages={overview,lines,checks,tasks,issues,team,approvals,kpis,projects,data};$("page").innerHTML=pages[view]();bind()}
function dialog(html,submit){$("modal").innerHTML='<div class="dialog"><div class="split"><h2>'+html.title+'</h2><button class="btn alt small" id="closeModal">✕</button></div><form id="dialogForm">'+html.body+'<div class="buttons" style="margin-top:18px"><button class="btn" type="submit">Lưu</button><button class="btn alt" type="button" id="cancelModal">Hủy</button></div></form></div>';$("modal").classList.remove("hidden");$("closeModal").onclick=$("cancelModal").onclick=()=>closeModal();$("dialogForm").onsubmit=e=>{e.preventDefault();submit(new FormData(e.target))}}
function closeModal(){$("modal").classList.add("hidden");$("modal").replaceChildren()}
const field=(name,label,value="",type="text")=>'<div><label>'+esc(label)+'</label><input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(name==="name"||name==="title"?"required":"")+'></div>';
const sel=(name,label,values,value)=>'<div><label>'+label+'</label><select name="'+name+'">'+values.map(x=>'<option value="'+esc(x)+'" '+(x===value?"selected":"")+'>'+esc(x)+'</option>').join("")+'</select></div>';
const txt=(name,label,value)=>'<div><label>'+label+'</label><textarea name="'+name+'">'+esc(value||"")+'</textarea></div>';
function taskForm(id){const t=db.tasks.find(x=>x.id===id)||{id:uid(),name:"",owner:"",role:"Engineer",priority:"Medium",progress:0,complexity:2,due:"",status:"Not started",issueId:"",evidence:""};dialog({title:id?"Chi tiết Task":"Thêm Task",body:'<div class="formgrid">'+field("name","Tên công việc",t.name)+field("owner","PIC",t.owner)+sel("role","Vai trò",["Engineer","Technician","Leader"],t.role)+sel("priority","Priority",["Low","Medium","High"],t.priority)+field("due","Due date",t.due,"date")+field("progress","Progress (%)",t.progress,"number")+sel("status","Trạng thái",["Not started","In progress","Pending review","Pending manager","Reviewed","Rejected"],t.status)+field("issueId","Issue ID",t.issueId)+'</div>'+txt("evidence","Evidence / Ghi chú",t.evidence)},f=>{let x={...t};for(const k of ["name","owner","role","priority","due","status","issueId","evidence"])x[k]=String(f.get(k)||"").trim();x.progress=Number(f.get("progress"));if(x.progress<0||x.progress>100||!Number.isFinite(x.progress))return toast("Progress phải từ 0–100");if(id&&t.status==="Reviewed"&&JSON.stringify(x)!==JSON.stringify(t)){x.status="Pending review";x.approved=null;x.reviewer="";}const index=db.tasks.findIndex(q=>q.id===x.id);if(index<0)db.tasks.push(x);else db.tasks[index]=x;stamp("task",x.id,id?"updated":"created");if(save()){closeModal();render();toast("Đã lưu Task")}})}
function issueForm(id){const x=db.issues.find(i=>i.id===id)||{id:uid(),date:today(),line:"Line 1",lot:"",title:"",severity:"Major",status:"Open",pic:"",due:"",cause:"",action:"",verify:"",description:""};dialog({title:id?"Issue & CAPA":"Tạo Issue",body:'<div class="formgrid">'+field("title","Vấn đề",x.title)+field("line","Line",x.line)+field("lot","Lot",x.lot)+field("pic","PIC",x.pic)+sel("severity","Severity",["Minor","Major","Critical"],x.severity)+sel("status","Status",["Open","In progress","Monitoring","Closed"],x.status)+field("due","Due date",x.due,"date")+'</div>'+txt("description","Mô tả",x.description)+txt("cause","Root Cause / 5 Why",x.cause)+txt("action","Containment / Corrective Action",x.action)+txt("verify","Effectiveness Check",x.verify)},f=>{const y={...x};for(const k of ["title","line","lot","pic","severity","status","due","description","cause","action","verify"])y[k]=String(f.get(k)||"").trim();if(y.status==="Closed"&&(!y.cause||!y.action||!y.verify))return toast("Cần Root Cause, Action và Verification trước khi đóng Issue");const index=db.issues.findIndex(i=>i.id===y.id);if(index<0)db.issues.push(y);else db.issues[index]=y;stamp("issue",y.id,id?"updated":"created");if(save()){closeModal();render();toast("Đã lưu Issue")}})}
function reviewForm(id){const t=db.tasks.find(x=>x.id===id);if(!t)return;const stage=t.status,role=$("approverRole")?.value||"leader";if(stage==="Pending review"&&role!=="leader"||stage==="Pending manager"&&role!=="manager")return toast("Hãy chọn đúng vai trò demo để duyệt.");if(t.owner===("Demo "+(role==="leader"?"Leader":"Manager")))return toast("Không thể tự duyệt");dialog({title:"Review · "+esc(t.name),body:'<p class="muted">Stage: '+esc(stage)+' · Reviewer: Demo '+esc(role)+'</p>'+sel("decision","Decision",["Approved","Rejected"],"Approved")+field("percent","Verified %",t.progress,"number")+txt("comment","Comment (bắt buộc)","")},f=>{const pct=Number(f.get("percent")),comment=String(f.get("comment")||"").trim(),decision=String(f.get("decision"));if(!comment||!Number.isFinite(pct)||pct<0||pct>100)return toast("Comment và Verified % phải hợp lệ");const reviewer="Demo "+(role==="leader"?"Leader":"Manager");t.status=decision==="Rejected"?"Rejected":role==="leader"?"Pending manager":"Reviewed";t.approved=t.status==="Reviewed"?pct:null;t.reviewer=reviewer;db.reviews.push({id:uid(),taskId:t.id,name:t.name,reviewer,decision,percent:pct,comment,stage:role,date:now()});stamp("approval",t.id,decision);if(save()){closeModal();render();toast("Đã ghi nhận phê duyệt demo")}})}
function employeeForm(){dialog({title:"Thêm nhân sự demo",body:'<div class="formgrid">'+field("name","Tên nhân viên")+sel("role","Role",["Engineer","Technician","Leader","PE Manager"],"Engineer")+'</div>'},f=>{db.employees.push({id:uid(),name:String(f.get("name")).trim(),role:String(f.get("role")),active:true});if(save()){closeModal();render()}})}
function projectForm(){dialog({title:"Thêm dự án cải tiến",body:'<div class="formgrid">'+field("name","Tên dự án")+field("owner","Owner")+field("due","Due date","","date")+sel("status","Status",["Planned","In progress","Completed"],"Planned")+'</div>'},f=>{db.projects.push({id:uid(),name:String(f.get("name")).trim(),owner:String(f.get("owner")).trim(),due:String(f.get("due")),status:String(f.get("status"))});if(save()){closeModal();render()}})}
function downloadJSON(){const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a"),url=URL.createObjectURL(blob);a.href=url;a.download="pe-v9-backup-"+today()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function replaceData(candidate,label){let next;try{next=migrate(candidate,label)}catch(e){return toast("Lỗi dữ liệu: "+e.message)}if(!confirm("Thay dữ liệu V9 hiện tại? V7/V8 vẫn giữ nguyên. Hãy export backup trước khi tiếp tục."))return;const prior=db;db=next;if(!save()){db=prior;return}render();toast("Đã import dữ liệu vào V9")}
function migrateOld(){const found=[];for(const key of OLD){try{const raw=localStorage.getItem(key);if(raw){const o=JSON.parse(raw);const n=migrate(o,key);found.push({key,n})}}catch(e){toast("Nguồn "+key+" không hợp lệ: "+e.message)}}if(!found.length)return toast("Không tìm thấy V7/V8 trên cùng origin. Hãy import file JSON.");const labels=found.map((x,i)=>i+1+". "+x.key+" ("+x.n.tasks.length+" tasks, "+x.n.issues.length+" issues)").join("\n");const answer=prompt("Chọn số nguồn dữ liệu để COPY sang V9:\n"+labels,"1"),idx=Number(answer)-1;if(!Number.isInteger(idx)||!found[idx])return;replaceData(found[idx].n,found[idx].key)}
function sample(){if(collections.some(k=>db[k].length))return toast("Chỉ nạp mẫu khi V9 chưa có bản ghi. Hãy export và import nguồn riêng.");db.tasks=[{id:uid(),name:"Phân tích lỗi Vision alignment",owner:"Engineer A",role:"Engineer",priority:"High",progress:70,status:"Pending review",due:today(),issueId:"",evidence:"Vision NG tăng sau đổi ca"},{id:uid(),name:"Cập nhật WI Epoxy dispensing",owner:"Engineer B",role:"Engineer",priority:"Medium",progress:45,status:"In progress",due:today(),issueId:"",evidence:""},{id:uid(),name:"Kiểm tra curing profile",owner:"Technician C",role:"Technician",priority:"High",progress:100,status:"Pending manager",due:today(),issueId:"",evidence:"Đã kiểm tra 3 lô"}];db.issues=[{id:uid(),date:today(),title:"Vision misalignment",line:"Line 02",lot:"LOT-001",severity:"Major",status:"Open",pic:"Engineer A",due:today(),description:"Offset bất thường",cause:"Đang điều tra",action:"Kiểm tra camera",verify:""}];db.production=[{id:uid(),date:today(),project:"Sample",line:"Line 01",lot:"LOT-001",total:1200,good:1179},{id:uid(),date:today(),project:"Sample",line:"Line 02",lot:"LOT-002",total:1100,good:1062}];db.employees=[{id:uid(),name:"Engineer A",role:"Engineer"},{id:uid(),name:"Engineer B",role:"Engineer"},{id:uid(),name:"Technician C",role:"Technician"}];db.metadata.source="sample";save();render();toast("Đã nạp dữ liệu mẫu")}
function bind(){const b=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};b("newTask",()=>taskForm());b("newIssue",()=>issueForm());b("newEmployee",employeeForm);b("newProject",projectForm);b("exportData",downloadJSON);b("migrateOld",migrateOld);b("loadSamples",sample);b("taskTable",()=>toast("Bảng danh sách sẽ được mở rộng trong V9.1"));const ts=$("taskSearch");if(ts)ts.oninput=e=>{taskQuery=e.target.value;render();$("taskSearch").focus();$("taskSearch").setSelectionRange(taskQuery.length,taskQuery.length)};const is=$("issueSearch");if(is)is.oninput=e=>{issueQuery=e.target.value;render();$("issueSearch").focus();$("issueSearch").setSelectionRange(issueQuery.length,issueQuery.length)};document.querySelectorAll("[data-edit-task]").forEach(e=>e.onclick=()=>taskForm(e.dataset.editTask));document.querySelectorAll("[data-edit-issue]").forEach(e=>e.onclick=()=>issueForm(e.dataset.editIssue));document.querySelectorAll("[data-review]").forEach(e=>e.onclick=()=>reviewForm(e.dataset.review));const f=$("importFile");if(f)f.onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>20*1024*1024)throw Error("File quá 20 MB");replaceData(JSON.parse(await file.text()),"uploaded-file")}catch(err){toast("Không thể import: "+err.message)}}}
$("date").textContent=new Date().toLocaleDateString("vi-VN");nav("overview");
</script></body></html>
